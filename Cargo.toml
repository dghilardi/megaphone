[package]
name = "megaphone-broker"
version = "0.11.0"
edition = "2021"

authors = ["Davide Ghilardi <dghila@d71.dev>"]
description = "Reverse proxy for long running requests and server streaming"
keywords = [ "http", "reverse-proxy", "infrastructure", "cloud" ]
repository = "https://github.com/dghilardi/megaphone"
license = "AGPL-3.0-only"
readme = "README.md"

[dependencies]
chrono = { version = "0.4.31", features = ["serde"] }
serde = { version = "1.0.147", features = ["derive"] }
serde_json = "1.0.87"
anyhow = "1.0.75"
rand = "0.10"

env_logger = "0.11"
log = "0.4.17"

config = "0.15"
thiserror = { version = "2.0" }
tokio = { version = "1.21.2", features = ["rt", "macros"] }
tokio-stream = { version = "0.1.14", optional = true }
futures = { version = "0.3.25" }

dashmap = "6.1"

axum = "0.8"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
lazy_static = "1.4.0"
regex = "1.10.2"


clap = { version = "4.1.6", features = ["derive"], optional = true }
hyper = { version = "1", optional = true }
hyper-util = { version = "0.1", features = ["client-legacy"], optional = true }
http-body-util = { version = "0.1", optional = true }
hyperlocal = { version = "0.9", default-features = false, features = ["client"], optional = true }

tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"
hex = "0.4.3"

megaphone = "0.10"
md5 = "0.8"
ring = "0.17"
base64 = "0.23"
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls", "charset", "http2", "system-proxy"] }

[features]
bin-cli = [ "clap", "hyper", "hyper-util", "http-body-util", "hyperlocal"]

[[bin]]
name = "megactl"
required-features = ["bin-cli"]

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
kube = { version = "4.2", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.28", features = ["latest"] }
lazy_static = "1.4.0"
tempfile = "3.27"
serial_test = "4.0"
megaphone = { version = "0.10", features = ["client"] }

[dev-dependencies.testcontainers]
version = "0.28"
